server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # O index.html deve sempre ser revalidado.
    # Assim o navegador descobre imediatamente um novo deploy.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;

        try_files $uri =404;
    }

    # Bundles gerados pelo Angular possuem hash no nome:
    # main-W6SUGN6M.js, chunk-XXXX.js, styles-RN6N6RDE.css etc.
    location ~* \.(js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;

        try_files $uri =404;
    }

    # Fonts e imagens
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        add_header Cache-Control "public, max-age=2592000" always;

        try_files $uri =404;
    }

    # Rotas do Angular:
    # /usuarios, /clientes, /home etc.
    location / {
        try_files $uri $uri/ /index.html;
    }
}