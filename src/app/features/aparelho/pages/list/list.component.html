<p-table
  #tabela
  [value]="dados2"
  [lazy]="true"
  (onLazyLoad)="carregar($event)"
  [paginator]="true"
  [rows]="10"
  [totalRecords]="total"
  [loading]="loading"
  [rowsPerPageOptions]="[10,20,50]"
  responsiveLayout="scroll"
  [showCurrentPageReport]="true"
  currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords}"
>

  <ng-template pTemplate="header">
    <tr>
      <th pSortableColumn="aparelhoId">
        ID
        <p-sortIcon field="aparelhoId"></p-sortIcon>
      </th>

      <th pSortableColumn="marca">
        Marca
        <p-sortIcon field="marca"></p-sortIcon>
      </th>

      <th pSortableColumn="modelo">
        Modelo
        <p-sortIcon field="modelo"></p-sortIcon>
      </th>

      <th pSortableColumn="modeloComercial">
        Modelo Comercial
        <p-sortIcon field="modeloComercial"></p-sortIcon>
      </th>

      <th>Número Série</th>

      <th>Status</th>

      <th>Ações</th>
    </tr>
  </ng-template>

  <ng-template pTemplate="body" let-item>
    <tr class="hover:bg-gray-50">

      <td>
        {{ item.aparelhoId }}
      </td>

      <td>
        {{ item.marca }}
      </td>

      <td>
        {{ item.modelo }}
      </td>

      <td>
        {{ item.modeloComercial }}
      </td>

      <td>
        {{ item.numeroSerie }}
      </td>

      <td>
        {{ item.statusAparelho }}
      </td>

      <td class="flex gap-2">

        <p-button
          icon="pi pi-pencil"
          severity="secondary"
          rounded
        />

        <p-button
          icon="pi pi-trash"
          severity="danger"
          rounded
        />

      </td>

    </tr>
  </ng-template>

</p-table>
