<p-table
  #tabela
  [value]="dados2"
  [lazy]="true"
  (onLazyLoad)="carregar($event)"
  [paginator]="true"
  [rows]="10"
  [totalRecords]="total"
  [loading]="loading"
  [rowsPerPageOptions]="[10, 20, 50]"
  responsiveLayout="scroll"
  [showCurrentPageReport]="true"
  currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords}"
>

  <!-- HEADER -->
  <ng-template pTemplate="body" let-item>

  <tr
    (click)="adicionarAparelho(item)"

    class="
      group
      relative
      cursor-pointer

      transform-gpu
      transition-[transform,background-color,box-shadow]
      duration-200
      ease-out

      hover:z-10
      hover:-translate-y-[2px]
      hover:scale-[1.006]
      hover:!bg-green-50
      hover:shadow-[0_6px_18px_rgba(220,38,38,0.15),inset_4px_0_0_#ef4444]

      active:translate-y-0
      active:scale-[0.997]
    "

    [ngClass]="
      clienteSelecionado?.clienteId === item.clienteId
        ? '!bg-red-100 shadow-[inset_4px_0_0_#dc2626]'
        : ''
    "
  >

    <td>
      {{ item.clienteId }}
    </td>

    <td>
      <span
        class="
          font-medium
          transition-colors
          duration-200
          group-hover:text-red-800
        "
      >
        {{ item.nome }}
      </span>
    </td>

    <td>
      {{ item.cpf | cpf }}
    </td>

    <td>
      {{ formatarTelefone(item.telefone) }}
    </td>

    <td>
      <div class="flex gap-2">

        <p-button
          icon="pi pi-pencil"
          severity="secondary"
          rounded
          pTooltip="Editar cliente"
          tooltipPosition="top"
          (onClick)="$event.stopPropagation()"
        >
        </p-button>

        <p-button
          icon="pi pi-trash"
          severity="danger"
          rounded
          pTooltip="Excluir cliente"
          tooltipPosition="top"
          (onClick)="$event.stopPropagation()"
        >
        </p-button>

      </div>
    </td>

  </tr>

</ng-template>

</p-table>
